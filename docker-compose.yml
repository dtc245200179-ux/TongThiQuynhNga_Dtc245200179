version: "3.8"

services:
  db:
    image: postgres:15-alpine
    container_name: booking_db
    restart: always
    security_opt:
      - no-new-privileges:true
    environment:
      POSTGRES_USER: ${POSTGRES_USER:?Set POSTGRES_USER in .env}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?Set POSTGRES_PASSWORD in .env}
      POSTGRES_DB: ${POSTGRES_DB:?Set POSTGRES_DB in .env}
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
      interval: 5s
      timeout: 5s
      retries: 10
    volumes:
      - postgres_data:/var/lib/postgresql/data
    networks:
      - backend-net

  pgadmin:
    image: dpage/pgadmin4
    container_name: booking_pgadmin
    restart: always
    security_opt:
      - no-new-privileges:true
    environment:
      PGADMIN_DEFAULT_EMAIL: ${PGADMIN_DEFAULT_EMAIL:?Set PGADMIN_DEFAULT_EMAIL in .env}
      PGADMIN_DEFAULT_PASSWORD: ${PGADMIN_DEFAULT_PASSWORD:?Set PGADMIN_DEFAULT_PASSWORD in .env}
      PGADMIN_LISTEN_PORT: 8080
    ports:
      - "5050:8080"
    depends_on:
      db:
        condition: service_healthy
    networks:
      - backend-net

  api:
    build: ./backend
    container_name: booking_api
    restart: always
    security_opt:
      - no-new-privileges:true
    environment:
      POSTGRES_HOST: db
      POSTGRES_PORT: 5432
      POSTGRES_USER: ${POSTGRES_USER:?Set POSTGRES_USER in .env}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?Set POSTGRES_PASSWORD in .env}
      POSTGRES_DB: ${POSTGRES_DB:?Set POSTGRES_DB in .env}
      AUTH_TOKEN_SECRET: ${AUTH_TOKEN_SECRET:-}
    ports:
      - "8000:8000"
    depends_on:
      db:
        condition: service_healthy
    networks:
      - backend-net

  postgres-exporter:
    image: prometheuscommunity/postgres-exporter:v0.17.1
    container_name: booking_postgres_exporter
    restart: always
    security_opt:
      - no-new-privileges:true
    environment:
      DATA_SOURCE_URI: db:5432/${POSTGRES_DB:?Set POSTGRES_DB in .env}?sslmode=disable
      DATA_SOURCE_USER: ${POSTGRES_USER:?Set POSTGRES_USER in .env}
      DATA_SOURCE_PASS: ${POSTGRES_PASSWORD:?Set POSTGRES_PASSWORD in .env}
    depends_on:
      db:
        condition: service_healthy
    networks:
      - backend-net

  docker-socket-proxy:
    image: tecnativa/docker-socket-proxy:0.3.0
    container_name: booking_docker_socket_proxy
    restart: always
    security_opt:
      - no-new-privileges:true
    environment:
      CONTAINERS: 1
      PING: 1
      VERSION: 1
      POST: 0
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock:ro
    networks:
      - backend-net

  container-exporter:
    build: ./monitoring/container-exporter
    container_name: booking_container_exporter
    restart: always
    security_opt:
      - no-new-privileges:true
    environment:
      DOCKER_API_URL: http://docker-socket-proxy:2375
      EXPORTER_PROJECT_NAME: ${COMPOSE_PROJECT_NAME:-trienkhai}
    depends_on:
      - docker-socket-proxy
    networks:
      - backend-net

  web:
    build: ./frontend
    container_name: booking_web
    restart: always
    security_opt:
      - no-new-privileges:true
    ports:
      - "3000:3000"
    depends_on:
      - api
    networks:
      - backend-net
      - frontend-net

  nginx:
    image: nginx:alpine
    container_name: booking_nginx
    restart: always
    security_opt:
      - no-new-privileges:true
    ports:
      - "3333:80"
    volumes:
      - ./nginx/nginx.conf:/etc/nginx/conf.d/default.conf:ro
    depends_on:
      - web
      - api
    networks:
      - frontend-net
      - backend-net

  prometheus:
    image: prom/prometheus:latest
    container_name: booking_prometheus
    restart: always
    security_opt:
      - no-new-privileges:true
    ports:
      - "9090:9090"
    volumes:
      - ./prometheus/prometheus.yml:/etc/prometheus/prometheus.yml:ro
    depends_on:
      - api
      - postgres-exporter
      - container-exporter
    networks:
      - backend-net

  grafana:
    image: grafana/grafana:latest
    container_name: booking_grafana
    restart: always
    security_opt:
      - no-new-privileges:true
    ports:
      - "3001:3000"
    volumes:
      - ./grafana/provisioning/datasources:/etc/grafana/provisioning/datasources:ro
      - ./grafana/provisioning/dashboards:/etc/grafana/provisioning/dashboards:ro
      - ./grafana/dashboards:/var/lib/grafana/dashboards:ro
    depends_on:
      - prometheus
    networks:
      - backend-net

  loki:
    image: grafana/loki:latest
    container_name: booking_loki
    restart: always
    security_opt:
      - no-new-privileges:true
    ports:
      - "3100:3100"
    volumes:
      - ./loki/loki-config.yml:/etc/loki/local-config.yaml:ro
    networks:
      - backend-net

  promtail:
    image: grafana/promtail:latest
    container_name: booking_promtail
    restart: always
    security_opt:
      - no-new-privileges:true
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock:ro
      - ./promtail/promtail-config.yml:/etc/promtail/config.yml:ro
    command: -config.file=/etc/promtail/config.yml
    depends_on:
      - loki
    networks:
      - backend-net

networks:
  backend-net:
    driver: bridge
  frontend-net:
    driver: bridge

volumes:
  postgres_data:
