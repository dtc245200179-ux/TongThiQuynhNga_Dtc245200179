version: '3.8'

services:
  db:
    image: postgres:15-alpine
    container_name: booking_db
    restart: always
    environment:
      POSTGRES_USER: admin
      POSTGRES_PASSWORD: StrongAdminPassword2026!
      POSTGRES_DB: booking_tour
    volumes:
      - postgres_data:/var/lib/postgresql/data
    networks:
      - backend-net

  pgadmin:
    image: dpage/pgadmin4
    container_name: booking_pgadmin
    restart: always
    environment:
      PGADMIN_DEFAULT_EMAIL: admin@booking.com
      PGADMIN_DEFAULT_PASSWORD: StrongAdminPassword2026!
    ports:
      - "5050:80"
    depends_on:
      - db
    networks:
      - backend-net

  api:
    build: ./backend
    container_name: booking_api
    restart: always
    environment:
      - DATABASE_URL=postgresql://admin:StrongAdminPassword2026!@db:5432/booking_tour
    ports:
      - "8000:8000"
    depends_on:
      - db
    networks:
      - backend-net

  web:
    build: ./frontend
    container_name: booking_web
    restart: always
    depends_on:
      - api
    networks:
      - backend-net
      - frontend-net

  nginx:
    image: nginx:alpine
    container_name: booking_nginx
    restart: always
    ports:
      - "3333:80" # <-- Ánh xạ cổng 3333 bên ngoài vào 80 bên trong
    volumes:
      - ./nginx/nginx.conf:/etc/nginx/conf.d/default.conf:ro
    depends_on:
      - web
      - api
    networks:
      - frontend-net
      - backend-net

networks:
  backend-net:
    driver: bridge
  frontend-net:
    driver: bridge

volumes:
  postgres_data: