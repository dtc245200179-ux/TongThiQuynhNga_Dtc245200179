server {
    listen 80;
    server_name _;

    # Hardening: Các Security Headers cơ bản theo yêu cầu đề bài
    add_header X-Frame-Options "SAMEORIGIN" always;
    add_header X-XSS-Protection "1; mode=block" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header Referrer-Policy "no-referrer-when-downgrade" always;

    # Điều hướng trang chủ (/) vào Frontend Next.js
    location / {
        proxy_pass http://booking_web:3000;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    }

    # Điều hướng các request chứa /api/ vào Backend FastAPI
    location /api/ {
        rewrite ^/api/(.*) /$1 break;
        proxy_pass http://booking_api:8000;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    }
}